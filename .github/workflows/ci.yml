name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec vitest run
      # The end-to-end tests (pnpm e2e) need the backend and a database, so they are run on a developer's machine.

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/signoffly-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: signoffly-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and reads its settings when it starts, not when it was built
        run: |
          docker run -d --name web -p 3000:3000 \
            -e SITE_URL=https://ci.example -e LEGAL_OPERATOR_NAME="CI Operator" -e LEGAL_CONTACT_EMAIL=ci@example.com \
            -e GO_API_URL=http://127.0.0.1:9 -e AUTH_SECRET=0123456789012345678901234567890123456789 -e AUTH_URL=http://localhost:3000 -e AUTH_TRUST_HOST=true \
            signoffly-frontend:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "https://ci.example/sitemap.xml"
          curl -fsS http://127.0.0.1:3000/privacy | grep -q "CI Operator"
          curl -fsS http://127.0.0.1:3000/ | grep -q "ready to ship"
          test "$(docker exec web id -u)" != 0
      - name: Log in to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
